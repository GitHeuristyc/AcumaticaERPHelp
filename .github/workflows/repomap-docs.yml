name: Repo docs automation

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, closed]

jobs:
  detect:
    if: github.event.pull_request.merged == true || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      target_branch: ${{ steps.check.outputs.target_branch }}
    steps:
      - id: check
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          DEFAULT="${{ github.event.repository.default_branch }}"
          if [[ "$BASE" == "$DEFAULT" ]] || echo "$BASE" | grep -qE '^20[0-9]{2}r[0-9]+$'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "target_branch=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  generate_docs:
    needs: detect
    if: |
      needs.detect.outputs.should_run == 'true' &&
      github.event.action != 'closed' &&
      !github.event.pull_request.draft &&
      github.actor != 'heuristyc-docs-bot[bot]' &&
      !startsWith(github.event.pull_request.title, 'AUTOMATION: Cascade Merge')
    uses: GitHeuristyc/repo-map/.github/workflows/repomap-docs.yml@main
    with:
      tools_ref: "main"
      target_branch: ${{ github.event.pull_request.head.ref }}
      dispatch_macrorepo: false
    secrets: inherit

  dispatch_macrorepo:
    needs: detect
    if: needs.detect.outputs.should_run == 'true' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.README_BOT_APP_ID }}
          private-key: ${{ secrets.README_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: HC.CODESUMMARY
      - name: Dispatch HC.CODESUMMARY
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          gh api -X POST -H "Accept: application/vnd.github+json" \
            "/repos/GitHeuristyc/HC.CODESUMMARY/dispatches" \
            -f event_type="repo-docs-updated" \
            -f "client_payload[repo_full_name]=${GITHUB_REPOSITORY}" \
            -f "client_payload[repo_name]=$(basename ${GITHUB_REPOSITORY})" \
            -f "client_payload[ref]=${{ needs.detect.outputs.target_branch }}" \
            -f "client_payload[sha]=${{ github.event.pull_request.merge_commit_sha }}"
