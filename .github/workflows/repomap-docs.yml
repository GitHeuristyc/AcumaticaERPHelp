name: Repo docs automation

on:
  pull_request:
    types: [closed]
    paths-ignore:
      - ".github/workflows/**"

jobs:
  repomap_docs:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch

    uses: GitHeuristyc/repo-map/.github/workflows/repomap-docs.yml@main

    with:
      tools_ref: "main"
      target_branch: ${{ github.event.repository.default_branch }}
      dispatch_macrorepo: true
      macrorepo_full_name: "GitHeuristyc/HC.CODESUMMARY"

    secrets: inherit
